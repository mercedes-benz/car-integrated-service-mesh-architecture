syntax = "proto3";

package com.mercedes_benz.csa;

import "google/protobuf/empty.proto";

service Adapter {
  rpc GetAvailableServices(google.protobuf.Empty) returns (Services) {}
  rpc CallMethod(Method) returns (MethodCallResponse) {}
}

message Service {
  int32 service_id = 1;
  int32 instance_id = 2;
}

message Services {
  repeated Service services = 1;
}

message Method {
  Service service = 1;
  int32 method_id = 2;
  bytes data = 3;
}

message MethodCallResponse {
  bytes data = 1;
}